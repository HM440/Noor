<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dholki Invitation</title>

<style>
body {
  margin: 0;
  background: #fff8f5;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* PASSWORD SCREEN */
#password-screen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #fff8f5;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  text-align: center;
}

.box input {
  padding: 10px;
  font-size: 16px;
}

.box button {
  padding: 10px 20px;
  margin-top: 10px;
  background: #e91e63;
  color: white;
  border: none;
  cursor: pointer;
}

/* CARD */
.card-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.card-container img {
  width: 90%;
  max-width: 700px;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* FLOWERS */
.flower {
  position: absolute;
  top: -50px;
  width: 30px;
  height: 30px;
  background-image: url('https://png.pngtree.com/png-clipart/20210311/original/pngtree-flower-petals-png-image_6057473.png');
  background-size: cover;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
  }
}
</style>

</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="password-screen">
  <div class="box">
    <h2>Enter Password</h2>
    <input type="password" id="password" placeholder="Password">
    <br>
    <button onclick="checkPassword()">Enter</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="main-content" style="display:none;">

  <!-- MUSIC -->
  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8e0e0c8a6.mp3?filename=romantic-background-112191.mp3" type="audio/mpeg">
  </audio>

  <!-- CARD IMAGE -->
  <div class="card-container">
    <img src="https://i.imgur.com/your-image-link.png" alt="Dholki Card">
  </div>

</div>

<script>
function checkPassword() {
  const input = document.getElementById("password").value;

  if (input === "Noor") {
    document.getElementById("password-screen").style.display = "none";
    document.getElementById("main-content").style.display = "block";

    document.getElementById("music").play();
  } else {
    document.getElementById("error").innerText = "Wrong Password!";
  }
}

// FLOWERS
function createFlower() {
  const flower = document.createElement("div");
  flower.classList.add("flower");

  flower.style.left = Math.random() * window.innerWidth + "px";
  flower.style.animationDuration = (3 + Math.random() * 5) + "s";
  flower.style.opacity = Math.random();

  document.body.appendChild(flower);

  setTimeout(() => {
    flower.remove();
  }, 8000);
}

setInterval(createFlower, 300);
</script>

</body>
</html>
